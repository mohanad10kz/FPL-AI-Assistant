name: FPL Daily Check

on:
  # ── جدولة يومية: كل يوم الساعة 12:00 UTC
  # main.py سيفحص الديدلاين تلقائياً — إذا كان أكثر من 24 ساعة لا يُرسل شيء
  schedule:
    - cron: "0 12 * * *"

  # ── تشغيل يدوي من تبويب Actions للاختبار
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "تشغيل بوضع التنقيح (يطبع بيانات إضافية)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write   # مطلوب لعملية git push في نهاية التشغيل

jobs:
  run-fpl-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # منع التشغيل المفتوح لو علق بشكل غير متوقع

    steps:
      # ── الخطوة 1: سحب الكود ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # نحتاج التاريخ الكامل لعملية git push

      # ── الخطوة 2: إعداد Python ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"       # تسريع التثبيت بالتشغيلات التالية

      # ── الخطوة 3: تثبيت المتطلبات ───────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── الخطوة 4: تشغيل المساعد ─────────────────────────────────────────
      # main.py يفحص الديدلاين تلقائياً:
      #   • إذا تبقى > 24 ساعة  → يخرج فوراً بكود 0 (بدون إرسال)
      #   • إذا تبقى ≤ 24 ساعة  → يُكمل التحليل ويُرسل التقارير
      #   • إذا same GW مُرسَل   → يخرج بكود 0 (بدون تكرار)
      - name: Run FPL AI Assistant
        env:
          FPL_TEAM_IDS: ${{ secrets.FPL_TEAM_IDS }}
          FPL_TEAM_NAMES: ${{ secrets.FPL_TEAM_NAMES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # INJURY_SOURCE_URL و TOP_N_MANAGERS اختياريان (لهما قيم افتراضية في config.py)
        run: |
          echo "=== FPL AI Assistant — بدء التشغيل ==="
          echo "الوقت: $(date -u)"
          python src/main.py
          echo "=== انتهى التشغيل ==="

      # ── الخطوة 5: حفظ ملفات الحالة والأرشيف (ضروري لتراكم البيانات) ────
      # ⚠️ حرجة: بيئة GitHub Actions مؤقتة — بدون هذا الـ commit تُفقد:
      #   - transfer_queue_{team_id}.json  → يتعطل التخطيط متعدد الجولات
      #   - last_sent_gw.json              → يُرسل تقرير مكرر في كل تشغيل
      #   - data/history/{team_id}/        → يُفقد الأرشيف التاريخي
      - name: Commit updated state and history files
        run: |
          git config user.name "fpl-bot[bot]"
          git config user.email "fpl-bot@users.noreply.github.com"

          # إضافة ملفات الحالة والأرشيف فقط (لا نضيف .env أو أي ملفات حساسة)
          git add data/state/ data/history/ || true

          # الـ commit يفشل برمز خروج 1 لو لا توجد تغييرات — نتجاهله
          git commit -m "chore: update FPL state after daily check [skip ci]" || echo "No state changes to commit"

          # push آمن مع retry بسيط
          git push origin HEAD || git push --force-with-lease origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
